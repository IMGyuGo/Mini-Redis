<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1120" viewBox="0 0 1480 1120" role="img" aria-labelledby="title desc">
  <title id="title">Mini Redis architecture</title>
  <desc id="desc">A high-level architecture diagram showing the Mini Redis client, protocol, network, command routing, and internal engine managers.</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ec; }
      .panel { fill: #fffdf8; stroke: #3c3c3c; stroke-width: 2; rx: 20; ry: 20; }
      .lane { fill: #f2ede1; stroke: #5b5b5b; stroke-width: 2; rx: 18; ry: 18; }
      .box { fill: #fff; stroke: #444; stroke-width: 2; rx: 14; ry: 14; }
      .box-strong { fill: #ffe8b8; stroke: #444; stroke-width: 2.5; rx: 14; ry: 14; }
      .box-soft { fill: #e5f3ff; stroke: #444; stroke-width: 2; rx: 14; ry: 14; }
      .box-core { fill: #d7f0dd; stroke: #444; stroke-width: 2.5; rx: 14; ry: 14; }
      .box-store { fill: #efe3ff; stroke: #444; stroke-width: 2; rx: 14; ry: 14; }
      .title { font: 700 34px Arial, sans-serif; fill: #1c1c1c; }
      .subtitle { font: 600 22px Arial, sans-serif; fill: #2a2a2a; }
      .label { font: 600 18px Arial, sans-serif; fill: #222; }
      .text { font: 500 16px Arial, sans-serif; fill: #222; }
      .small { font: 500 14px Arial, sans-serif; fill: #333; }
      .num { font: 700 16px Arial, sans-serif; fill: #fff; }
      .arrow { stroke: #444; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .divider { stroke: #777; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1480" height="1120"/>

  <text class="title" x="60" y="62">Mini Redis Architecture</text>
  <text class="subtitle" x="60" y="98">Startup wiring and request flow, from CLI input to storage and persistence managers</text>

  <rect class="panel" x="40" y="130" width="1400" height="360"/>
  <text class="subtitle" x="70" y="170">1. Request execution flow</text>

  <rect class="lane" x="70" y="200" width="1340" height="110"/>
  <text class="label" x="92" y="230">Client side</text>

  <rect class="lane" x="70" y="330" width="1340" height="130"/>
  <text class="label" x="92" y="360">Server side</text>

  <circle cx="125" cy="255" r="20" fill="#d2632a"/><text class="num" x="119" y="261">1</text>
  <rect class="box" x="155" y="225" width="180" height="58"/>
  <text class="label" x="208" y="248">CLI input</text>
  <text class="small" x="195" y="268">mini_redis/cli/client.py</text>

  <circle cx="385" cy="255" r="20" fill="#d2632a"/><text class="num" x="379" y="261">2</text>
  <rect class="box" x="415" y="225" width="180" height="58"/>
  <text class="label" x="455" y="248">CLI parser</text>
  <text class="small" x="448" y="268">cli/parser.py</text>

  <circle cx="645" cy="255" r="20" fill="#d2632a"/><text class="num" x="639" y="261">3</text>
  <rect class="box-soft" x="675" y="225" width="190" height="58"/>
  <text class="label" x="715" y="248">RESP encode</text>
  <text class="small" x="715" y="268">protocol/resp.py</text>

  <circle cx="930" cy="255" r="20" fill="#d2632a"/><text class="num" x="924" y="261">4</text>
  <rect class="box-soft" x="960" y="225" width="180" height="58"/>
  <text class="label" x="1007" y="248">TCP client</text>
  <text class="small" x="999" y="268">network/tcp_client.py</text>

  <circle cx="1185" cy="255" r="20" fill="#d2632a"/><text class="num" x="1179" y="261">5</text>
  <rect class="box-soft" x="1215" y="225" width="160" height="58"/>
  <text class="label" x="1247" y="248">TCP socket</text>
  <text class="small" x="1242" y="268">wire transport</text>

  <line class="arrow" x1="335" y1="254" x2="415" y2="254"/>
  <line class="arrow" x1="595" y1="254" x2="675" y2="254"/>
  <line class="arrow" x1="865" y1="254" x2="960" y2="254"/>
  <line class="arrow" x1="1140" y1="254" x2="1215" y2="254"/>
  <line class="arrow" x1="1295" y1="284" x2="1295" y2="355"/>

  <circle cx="1205" cy="395" r="20" fill="#33658a"/><text class="num" x="1199" y="401">6</text>
  <rect class="box-soft" x="975" y="365" width="200" height="60"/>
  <text class="label" x="1014" y="389">TCP server</text>
  <text class="small" x="1010" y="410">network/tcp_server.py</text>

  <circle cx="925" cy="395" r="20" fill="#33658a"/><text class="num" x="919" y="401">7</text>
  <rect class="box-soft" x="695" y="365" width="210" height="60"/>
  <text class="label" x="744" y="389">RESP decode</text>
  <text class="small" x="735" y="410">protocol/resp.py</text>

  <circle cx="620" cy="395" r="20" fill="#33658a"/><text class="num" x="614" y="401">8</text>
  <rect class="box-strong" x="340" y="365" width="250" height="60"/>
  <text class="label" x="388" y="389">CommandManager</text>
  <text class="small" x="374" y="410">validate, queue, route</text>

  <circle cx="300" cy="395" r="20" fill="#33658a"/><text class="num" x="294" y="401">9</text>
  <rect class="box" x="90" y="365" width="180" height="60"/>
  <text class="label" x="142" y="389">Handlers</text>
  <text class="small" x="120" y="410">commands/handlers/*.py</text>

  <line class="arrow" x1="975" y1="394" x2="905" y2="394"/>
  <line class="arrow" x1="695" y1="394" x2="590" y2="394"/>
  <line class="arrow" x1="340" y1="394" x2="270" y2="394"/>

  <line class="divider" x1="730" y1="470" x2="730" y2="520"/>

  <rect class="panel" x="40" y="520" width="1400" height="420"/>
  <text class="subtitle" x="70" y="560">2. Internal engine and manager boundaries</text>

  <rect class="box-core" x="565" y="600" width="350" height="90"/>
  <text class="label" x="705" y="632" text-anchor="middle">Redis engine</text>
  <text class="text" x="705" y="658" text-anchor="middle">engine/redis.py</text>
  <text class="small" x="705" y="680" text-anchor="middle">orchestrates storage, ttl, persistence, invalidation, mongo</text>

  <rect class="box-store" x="90" y="760" width="260" height="92"/>
  <text class="label" x="220" y="792" text-anchor="middle">StorageManager</text>
  <text class="text" x="220" y="816" text-anchor="middle">storage/manager.py</text>
  <text class="small" x="220" y="838" text-anchor="middle">hash table + incremental rehashing</text>

  <rect class="box-store" x="390" y="760" width="210" height="92"/>
  <text class="label" x="495" y="792" text-anchor="middle">TTLManager</text>
  <text class="text" x="495" y="816" text-anchor="middle">storage/ttl.py</text>
  <text class="small" x="495" y="838" text-anchor="middle">expiration tracking</text>

  <rect class="box-store" x="640" y="760" width="220" height="92"/>
  <text class="label" x="750" y="792" text-anchor="middle">PersistenceManager</text>
  <text class="text" x="750" y="816" text-anchor="middle">persistence/manager.py</text>
  <text class="small" x="750" y="838" text-anchor="middle">AOF + snapshot + restore</text>

  <rect class="box-store" x="900" y="760" width="220" height="92"/>
  <text class="label" x="1010" y="792" text-anchor="middle">InvalidationManager</text>
  <text class="text" x="1010" y="816" text-anchor="middle">invalidation/manager.py</text>
  <text class="small" x="1010" y="838" text-anchor="middle">tag-to-key index</text>

  <rect class="box-store" x="1160" y="760" width="220" height="92"/>
  <text class="label" x="1270" y="792" text-anchor="middle">MongoManager</text>
  <text class="text" x="1270" y="816" text-anchor="middle">storage/mongo_manager.py</text>
  <text class="small" x="1270" y="838" text-anchor="middle">optional external sync</text>

  <line class="arrow" x1="645" y1="690" x2="295" y2="760"/>
  <line class="arrow" x1="680" y1="690" x2="540" y2="760"/>
  <line class="arrow" x1="740" y1="690" x2="750" y2="760"/>
  <line class="arrow" x1="800" y1="690" x2="980" y2="760"/>
  <line class="arrow" x1="835" y1="690" x2="1215" y2="760"/>

  <rect class="box" x="90" y="900" width="1290" height="28"/>
  <text class="small" x="735" y="919" text-anchor="middle">PersistenceManager internally delegates file I/O to aof.py, rdb.py, and meta.py</text>

  <rect class="panel" x="40" y="960" width="1400" height="120"/>
  <text class="subtitle" x="70" y="1000">3. Startup wiring</text>
  <text class="text" x="70" y="1034">server_main.py -&gt; build_command_manager() in bootstrap.py -&gt; create managers -&gt; build Redis -&gt; register handlers -&gt; start TCPServer</text>
  <text class="text" x="70" y="1064">cli_main.py -&gt; RespCodec + TCPClient + CLIClient -&gt; interactive terminal session</text>
</svg>
